name: Build VideoTrim Pro V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Check and extract V6 source
        run: |
          mkdir -p source
          ls -lh
          unzip -q VideoTrimPro-v6-Android-Source.zip -d source
          test -f source/VideoTrimPro/settings.gradle.kts

      - name: Build VideoTrim Pro APK
        run: |
          cd source/VideoTrimPro
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTrim-Pro-V6-APK
          path: source/VideoTrimPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

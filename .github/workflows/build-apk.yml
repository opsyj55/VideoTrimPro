name: Build VideoTrim Pro V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p source
          unzip -q VideoTrimPro-v6-Android-Source.zip -d source

          GRADLEW=$(find source -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "Could not find Gradle wrapper in ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          chmod +x "$GRADLEW"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTrim-Pro-V6-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

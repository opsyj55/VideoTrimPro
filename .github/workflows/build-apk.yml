name: Build VideoTrim Pro V6 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract V6 source
        run: |
          mkdir -p source
          unzip -q VideoTrimPro-v6-Android-Source.zip -d source
          test -f source/VideoTrimPro/settings.gradle.kts

      - name: Set Java compatibility to 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("source/VideoTrimPro/app/build.gradle.kts")
          s = p.read_text()

          java17 = """compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }"""

          pattern = r'compileOptions\s*\{[^{}]*\}'

          if re.search(pattern, s):
              s = re.sub(pattern, lambda _: java17, s, count=1)
          else:
              s = re.sub(r'android\s*\{',
                         lambda m: m.group(0) + "\n    " + java17,
                         s, count=1)

          p.write_text(s)
          PY

      - name: Build VideoTrim Pro APK
        run: |
          cd source/VideoTrimPro
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoTrim-Pro-V6-APK
          path: source/VideoTrimPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
